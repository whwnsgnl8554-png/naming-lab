name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workload Identity Federation: 서비스 계정 JSON 키 없이 인증 (안전)
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast3                    # 서울 리전 (한국 사용자 latency 최소)
  SERVICE: naming-lab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WIF 인증 (시크릿: WIF_PROVIDER, WIF_SERVICE_ACCOUNT)
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # 한 번의 명령으로 빌드(Cloud Build) → Artifact Registry → Cloud Run 배포
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source=. \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=256Mi \
            --concurrency=80 \
            --timeout=30s \
            --min-instances=0 \
            --max-instances=3 \
            --execution-environment=gen2 \
            --ingress=all \
            --quiet

      - name: Show URL
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
                  --region="$REGION" \
                  --project="$PROJECT_ID" \
                  --format='value(status.url)')
          echo "🚀 Deployed: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
